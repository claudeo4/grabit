<!doctype html><html lang="en" data-theme="dark"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GrabIt</title><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg"><meta name="theme-color" content="#0f1115">
<style>
:root{--bg:#0f1115;--cd:#181b22;--tx:#eef0f4;--mu:#9aa1ae;--ac:#7c5cff;--bd:#2a2f3a;--er:#ff6b6b}
[data-theme=light]{--bg:#f6f7fb;--cd:#fff;--tx:#14161c;--mu:#5d6573;--ac:#5b3df5;--bd:#dfe3ea;--er:#d93636}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px 130px}
main{max-width:560px;margin:auto;display:grid;gap:14px}
header{display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:28px}h1 span{color:var(--ac)}
button,input[type=url],.btn{font:inherit;min-height:48px;border-radius:14px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);padding:0 16px}
input[type=url]{width:100%;min-height:56px;font-size:17px}
.row{display:flex;gap:10px}.row button{flex:1}
.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.note{font-size:13px;color:var(--mu);margin:0}
.chk{display:flex;gap:10px;align-items:center;min-height:48px}.chk input{width:22px;height:22px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:18px;padding:14px}
.card img{width:100%;border-radius:12px;aspect-ratio:16/9;object-fit:cover;background:var(--bd)}
h2{font-size:18px;margin:10px 0 2px}h3{font-size:13px;color:var(--mu);text-transform:uppercase;margin:14px 0 6px}
.mu{color:var(--mu);font-size:14px;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:grid;text-align:left;min-width:96px;padding:6px 14px}.chip small{color:var(--mu)}
.chip.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac) inset}.chip:disabled{opacity:.4}
.sh{border-radius:12px;background:linear-gradient(90deg,var(--bd),transparent,var(--bd));background-size:200% 100%;animation:s 1.2s infinite}@keyframes s{to{background-position:-200% 0}}
.pb{height:12px;border-radius:6px;background:var(--bd);overflow:hidden;margin:12px 0}.pb i{display:block;height:100%;width:0;background:var(--ac);transition:width .4s}
.err{border-color:var(--er)}.err p{color:var(--er);margin-top:0}
#bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px max(12px,env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--bd)}
#bar>*{display:flex;align-items:center;justify-content:center;width:100%;max-width:560px;margin:auto;text-decoration:none}
</style></head><body><main>
<header><h1>Grab<span>It</span></h1><button id="th" aria-label="Toggle theme">🌓</button></header>
<p class="note">Only download content you own, have permission for, or that is public domain/Creative Commons. Respect each site's terms.</p>
<input id="url" type="url" inputmode="url" placeholder="Paste a video link" autocomplete="off">
<div class="row"><button id="paste">📋 Paste</button><button id="an" class="pri">Analyze</button></div>
<label class="chk"><input type="checkbox" id="pl"> Download playlist (max 10)</label>
<div class="card" data-v="sk"><div class="sh" style="height:190px"></div><div class="sh" style="height:22px;margin-top:14px"></div><div class="sh" style="height:48px;margin-top:14px"></div></div>
<div class="card" data-v="ready"><img id="thumb" alt=""><h2 id="ttl"></h2><p class="mu" id="meta"></p><div id="grp"></div></div>
<div class="card" data-v="dl done"><h2 id="pt"></h2><div class="pb"><i id="pf"></i></div><p class="mu" id="ptx"></p><button id="again" data-v="done" style="margin-top:12px;width:100%">Grab another</button></div>
<div class="card err" data-v="error"><p id="em"></p><button id="retry">Try again</button></div>
</main>
<div id="bar" data-v="ready done"><button id="go" class="pri">Download</button><a id="save" class="btn pri" download>Save file</a></div>
<script>
const $=s=>document.querySelector(s);let sel,retryFn;
function show(s){document.querySelectorAll('[data-v]').forEach(e=>e.hidden=!e.dataset.v.split(' ').includes(s));$('#go').hidden=s!='ready';$('#save').hidden=s!='done'}
function fail(m,f){$('#em').textContent=m;retryFn=f;show('error')}
const sz=n=>n?(n>=1e9?(n/1e9).toFixed(1)+' GB':Math.round(n/1e6)+' MB'):'size n/a';
const tm=s=>s==null?'…':Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
const spd=b=>b?(b>=1e6?(b/1e6).toFixed(1)+' MB/s':Math.round(b/1e3)+' KB/s'):'…';
async function api(p,b){const r=await fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(typeof j.detail=='string'?j.detail:'Something went wrong.');return j}
function pick(id){sel=id;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.id==id))}
function render(i){$('#thumb').src=i.thumbnail||'';$('#ttl').textContent=i.title;
 $('#meta').textContent=[i.uploader,i.playlist_count?i.playlist_count+' videos':i.duration?tm(i.duration):''].filter(Boolean).join(' · ');
 const g=$('#grp');g.innerHTML='';
 i.groups.forEach(x=>{if(!x.items.length)return;const h=document.createElement('h3');h.textContent=x.name;const w=document.createElement('div');w.className='chips';
  x.items.forEach(t=>{const b=document.createElement('button');b.className='chip';b.disabled=t.disabled;b.dataset.id=t.id;b.innerHTML='<b>'+t.label+'</b><small>'+(t.disabled?'too large':(t.size?'~':'')+sz(t.size))+'</small>';b.onclick=()=>pick(t.id);w.append(b)});g.append(h,w)});
 const all=i.groups.flatMap(x=>x.items).filter(t=>!t.disabled);pick((all.find(t=>t.id=='v720')||all[0]||{}).id)}
async function analyze(){const u=$('#url').value.trim();if(!u)return fail('Paste a video link first.',analyze);show('sk');
 try{render(await api('/api/info',{url:u,playlist:$('#pl').checked}));show('ready')}catch(e){fail(e.message,analyze)}}
function setP(p,t){$('#pf').style.width=p+'%';$('#ptx').textContent=t}
async function start(){if(!sel)return;$('#pt').textContent=$('#ttl').textContent||'Downloading';show('dl');setP(0,'Starting…');
 try{const {job_id}=await api('/api/download',{url:$('#url').value.trim(),quality:sel,playlist:$('#pl').checked});
  const es=new EventSource('/api/progress/'+job_id);
  es.onmessage=m=>{const d=JSON.parse(m.data);
   if(d.status=='error'){es.close();fail(d.error||'Download failed.',start)}
   else if(d.status=='done'){es.close();$('#save').href='/api/file/'+job_id;setP(100,'Ready to save');show('done')}
   else setP(d.percent||0,d.status=='processing'?'Processing…':d.percent+'% · '+spd(d.speed)+' · ETA '+tm(d.eta))}
 }catch(e){fail(e.message,start)}}
$('#paste').onclick=async()=>{try{$('#url').value=(await navigator.clipboard.readText()).trim()}catch{$('#url').focus()}};
$('#an').onclick=analyze;$('#go').onclick=start;$('#retry').onclick=()=>retryFn&&retryFn();$('#again').onclick=()=>show('ready');
$('#th').onclick=()=>{const n=document.documentElement.dataset.theme=='dark'?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem('th',n)}catch{}};
try{document.documentElement.dataset.theme=localStorage.getItem('th')||'dark'}catch{}
show('idle');if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');
</script></body></html>
